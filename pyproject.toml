[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "layoutlens"
description = "AI-powered UI testing framework with natural language visual validation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Gaurav Sood", email = "contact@gsood.com"}
]
maintainers = [
    {name = "Gaurav Sood", email = "contact@gsood.com"}
]
keywords = ["ui testing", "visual regression", "ai", "computer vision", "web testing", "layout testing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "Pillow>=10.0.0",
    "litellm>=1.80.10",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
# Optional extra for the google-genai inline batch backend (AI-Studio Gemini,
# ``gemini/*`` models) used by ``LayoutLens.judge_batch``. Imported lazily, so
# the base install and all other backends never require it.
gemini = ["google-genai>=1.0"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.7.0",
    "pre-commit>=3.0.0",
    "rich>=14.2.0",
    "pyright>=1.1.390",
    "pytest-asyncio>=0.21.0",
    # pydoclint is deliberately absent: its docstring-parser-fork dependency
    # installs the same `docstring_parser` module path as the plain
    # docstring-parser wheel other deps pull in, and whichever loses the race
    # crashes. Run it out-of-env: `uvx pydoclint layoutlens/`.
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
    "pytest-asyncio>=0.21.0",
    "coverage[toml]>=7.0.0",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-copybutton",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]
browser-use = [
    "browser-use>=0.13,<0.14",
]

[project.urls]
"Homepage" = "https://github.com/gojiplus/layoutlens"
"Bug Reports" = "https://github.com/gojiplus/layoutlens/issues"
"Documentation" = "https://gojiplus.github.io/layoutlens/"
"Source" = "https://github.com/gojiplus/layoutlens"
"Changelog" = "https://github.com/gojiplus/layoutlens/blob/main/CHANGELOG.md"

[project.scripts]
layoutlens = "layoutlens.cli:cli"

[tool.uv]
# browser-use 0.13.x hard-pins aiohttp==3.13.4, which has known CVEs
# (PYSEC-2026-2xxx family; fixed in 3.14). The pin is lockstep caution, not a
# known incompatibility, so force the patched line. Drop this once browser-use
# ships with aiohttp>=3.14.
override-dependencies = ["aiohttp>=3.14.3"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "requires_api: Tests that require API access",
    "performance: Performance benchmark tests",
    "browser: Tests that launch a real chromium browser",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["layoutlens"]
omit = [
    "tests/*",
    "setup.py",
    "*/conftest.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
ignore = ["D203", "D213", "E203", "E501", "F541"]
# × in viewport-size strings and ℹ in UI labels are intentional typography.
allowed-confusables = ["×", "ℹ"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**" = ["S101", "D", "T20", "F401"]
"docs/**" = ["D"]
# Demo scripts and benchmark harnesses talk to a terminal; printing is their job.
"examples/**" = ["T20", "D", "S", "F841"]
"benchmarks/**" = ["T20", "D", "S"]
"layoutlens/cli.py" = ["T20"]
# test_prompt/test_queries are library API names, not pytest items.
"layoutlens/prompts/utils.py" = ["PT"]

[tool.pyright]
include = ["layoutlens"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["layoutlens"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"

[tool.codespell]
# assets holds the vendored axe.min.js; benchmarks/results are frozen records
# of real runs (honest-numbers policy) — neither may be edited. codespell
# matches these globs against path components, not path prefixes.
skip = "assets,results,*.lock,.venv,_build,htmlcov"
# EHR is the healthcare acronym; "ment"/"unparseable" appear in a regex
# character class and in the frozen benchmark vocabulary respectively.
ignore-words-list = "unparseable,EHR,ment"

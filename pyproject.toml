[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "layoutlens"
description = "Deterministic accessibility and layout testing with optional vision-LLM analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Gaurav Sood", email = "contact@gsood.com"}
]
maintainers = [
    {name = "Gaurav Sood", email = "contact@gsood.com"}
]
keywords = ["ui testing", "visual regression", "accessibility", "WCAG", "playwright", "computer vision", "web testing", "layout testing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "Pillow>=10.0.0",
    "litellm>=1.80.10",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]
version = "2.1.0"

[project.optional-dependencies]
# Optional extra for the google-genai inline batch backend (AI-Studio Gemini,
# ``gemini/*`` models) used by ``LayoutLens.judge_batch``. Imported lazily, so
# the base install and all other backends never require it.
gemini = ["google-genai>=1.0"]
# MCP server (layoutlens-mcp): deterministic UI checks as agent tools.
mcp = ["fastmcp>=3"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.7.0",
    "pre-commit>=3.0.0",
    "rich>=14.2.0",
    "pyright>=1.1.390",
    "pytest-asyncio>=0.21.0",
    "pydoclint>=0.5",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
    "pytest-asyncio>=0.21.0",
    "coverage[toml]>=7.0.0",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-copybutton",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]
browser-use = [
    "browser-use>=0.13,<0.14",
]

[project.urls]
"Homepage" = "https://github.com/gojiplus/layoutlens"
"Bug Reports" = "https://github.com/gojiplus/layoutlens/issues"
"Documentation" = "https://gojiplus.github.io/layoutlens/"
"Source" = "https://github.com/gojiplus/layoutlens"
"Changelog" = "https://github.com/gojiplus/layoutlens/blob/main/CHANGELOG.md"

[project.scripts]
layoutlens = "layoutlens.cli:cli"
layoutlens-mcp = "layoutlens.mcp_server:main"

[project.entry-points.pytest11]
layoutlens = "layoutlens.pytest_plugin"

[tool.uv]
# browser-use 0.13.x lockstep-pins a set of dependencies at versions with
# known CVEs (aiohttp 3.13.4, click 8.3.1, mcp 1.26.0, pillow 12.2.0,
# pypdf 6.10.2) and pins openai==2.16.0, which caps litellm below 1.84 —
# the release fixing critical proxy CVEs. The pins are lockstep caution,
# not known incompatibilities, so force the patched lines. Drop once
# browser-use loosens its pins.
override-dependencies = [
    "aiohttp>=3.14.3",
    "openai>=2.20.0,<3",
    "click>=8.3.3",
    "mcp>=1.28.1,<2",
    "pillow>=12.3.0",
    "pypdf>=6.15.0",
]

[tool.uv.build-backend]
module-name = "layoutlens"
module-root = "src"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "requires_api: Tests that require API access",
    "performance: Performance benchmark tests",
    "browser: Tests that launch a real chromium browser",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["layoutlens"]
omit = [
    "tests/*",
    "setup.py",
    "*/conftest.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300", "E203", "E501", "F541"]
allowed-confusables = ["×", "ℹ"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF", "F401", "T20"]
"docs/**" = ["D"]
"**/__init__.py" = ["F401"]
"examples/**" = ["T20", "D", "S", "F841"]
"benchmarks/**" = ["T20", "D", "S"]
"src/layoutlens/cli.py" = ["T20"]
"src/layoutlens/prompts/utils.py" = ["PT"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'
skip-checking-private-functions = true
skip-checking-raises = true

[tool.codespell]
# assets holds the vendored axe.min.js; benchmarks/results are frozen records
# of real runs (honest-numbers policy) — neither may be edited. codespell
# matches these globs against path components, not path prefixes.
skip = "assets,results,*.lock,.venv,_build,htmlcov"
# EHR is the healthcare acronym; "ment"/"unparseable" appear in a regex
# character class and in the frozen benchmark vocabulary respectively.
ignore-words-list = "unparseable,EHR,ment"

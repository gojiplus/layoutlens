name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@v1
    with:
      wheel-import: layoutlens
      coverage-floor: 0
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      # pydoclint's docstring-parser-fork collides with the plain
      # docstring-parser module other deps install; run `uvx pydoclint
      # layoutlens/` out-of-env instead.
      run-pydoclint: false

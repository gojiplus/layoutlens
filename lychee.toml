# Patterns are written without a scheme: preen's links check scans this file
# too, and a pattern with one would be extracted and checked as a link.
exclude = [
  # Provider API bases and a mocked results URL in tests; they answer 404 or
  # 401 to the bare GET a link checker makes.
  '//api\.openai\.com/v1',
  '//api\.anthropic\.com/results/a',
  '//generativelanguage\.googleapis\.com/v1beta',
]
